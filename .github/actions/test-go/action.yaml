name: Go - Unit Testing
description: Sets up Go, downloads modules, and runs the test suite via make test.

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.27
        cache: true

    - name: Download Go modules
      shell: bash
      run: go mod download

    - name: Run tests
      shell: bash
      run: make test
